<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番付表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  body { font-family: sans-serif; background-color:#0f172a; text-align:center; margin:0; padding-bottom:60px; }
  h1 { color:#eaa016; text-shadow:2px 2px 4px rgba(0,0,0,0.8); margin-top:24px; font-size:32px; }
  .back-link { color:#94a3b8; text-decoration:none; font-size:15px; }
  .basho-btn {
    background-color: #1e293b;
    color: #94a3b8;
    border: 2px solid #334155;
    padding: 10px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    margin: 0 6px;
}
 .basho-btn.active {
    background-color: #f0c24d;
    color: #0f172a;
    border-color: #f0c24d;
    box-shadow: 0 0 12px rgba(240, 194, 77, 0.4);
}
  .division-tabs { display:flex; justify-content:center; gap:16px; margin:20px auto 14px auto; }
  .tab-btn { background-color:#1e293b; color:#94a3b8; border:2px solid #334155; padding:10px 28px; font-size:20px; font-weight:bold; border-radius:6px; cursor:pointer; }
  .tab-btn.active { background-color:#f0c24d; color:#0f172a; border-color:#f0c24d; }
  #banzuke-list { overflow-x:auto; -webkit-overflow-scrolling:touch; }
   .banzuke-table {
    width: 100%;
    max-width: 900px;
    margin: 20px auto;
    border-collapse: collapse;
    background: #fff;
    font-family: sans-serif;
    table-layout: fixed; /* 列の幅を固定し、文字量で崩れないようにする */
}
.banzuke-table th {
    background-color: #891d31;
    color: #fff;
    padding: 8px 4px;
    font-size: 15px;
    border: 1px solid #1e293b;
}
.banzuke-table td {
    border: 1px solid #334155;
    padding: 8px 4px;
    vertical-align: middle;
    word-break: break-word; /* はみ出しそうな文字を折り返す */
}
tr.tier-yokozuna td  { background-color: #fef3c7; }
tr.tier-ozeki td     { background-color: #fee2e2; }
tr.tier-sekiwake td  { background-color: #dbeafe; }
tr.tier-komusubi td  { background-color: #dcfce7; }

.rank-cell {
    width: 20%;
    font-weight: bold;
    color: #334155;
    background: #f1f5f9;
    font-size: 14px;
}
.name-cell {
    width: 40%;
}
.name-cell .shikona {
    font-family: 'Yuji Syuku', serif;
    font-size: 20px;
    font-weight: bold;
    color: #0f172a;
    display: block;
}
.name-cell .sub {
    font-size: 11px;
    color: #475569;
    display: block;
    margin-top: 2px;
}
.kyujo-mark {
    display: inline-block;
    font-size: 13px;
    color: #ffffff;
    background-color: #64748b;
    padding: 1px 7px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
}
.cell-record {
    font-size: 15px;
    color: #1e3a8a;
    font-weight: bold;
    margin-top: 4px;
    display: block;
}
.basho-select {
    font-size: 18px;
    padding: 10px 20px;
    border-radius: 6px;
    border: 2px solid #f0c24d;
    background-color: #fef3c7;
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
}

/* スマホ向けにさらにコンパクトに */
@media (max-width: 600px) {
    .banzuke-table th { font-size: 13px; padding: 6px 2px; }
    .rank-cell { font-size: 12px; }
    .name-cell .shikona { font-size: 16px; }
    .name-cell .sub { font-size: 9px; }
    .cell-record { font-size: 12px; }
    
}
</style>
</head>
<body>
  <h1 id="banzuke-title">番付表</h1>
  <a class="back-link" href="sumo_app_rs.html">← 取組表に戻る</a>

 <div style="margin:16px 0;">
  <select id="basho-select" class="basho-select" onchange="switchBanzukeBasho(this.value)"></select>
</div>

  <div class="division-tabs">
    <button id="tab-makuuchi" class="tab-btn active" onclick="switchBanzukeDivision('Makuuchi')">幕内</button>
    <button id="tab-juryo" class="tab-btn" onclick="switchBanzukeDivision('Juryo')">十両</button>
  </div>

  <div id="banzuke-list"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
let CURRENT_BASHO = urlParams.get('basho') || '202611';
let currentDivision = 'Makuuchi';

const BASHO_LABELS = {
  "202607": "令和八年 七月場所",
  "202609": "令和八年 九月場所",
  "202611": "令和八年 十一月場所"
};

const BASHO_SELECT_LABELS = {
  "202607": "7月場所（名古屋）",
  "202609": "9月場所（秋場所）",
  "202611": "11月場所（九州）"
};

function initBashoSelect() {
  const select = document.getElementById('basho-select');
  if (!select) return;
  select.innerHTML = '';
  Object.keys(BASHO_SELECT_LABELS).sort().reverse().forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = BASHO_SELECT_LABELS[code];
    select.appendChild(opt);
  });
  select.value = CURRENT_BASHO;
}

let EN_TO_JP_RIKISHI = {};


// 場所ごとの休場力士リスト（EN_TO_JP_RIKISHI のキー名と同じ表記で入力）
const KYUJO_RIKISHI = {
  "202609": ["hoshoryu", "wakatakakage", "wakanosho", "oshoumi","kotoshoho", "takanosho"]
};

function isKyujo(rawEnName) {
  const list = KYUJO_RIKISHI[CURRENT_BASHO] || [];
  return list.includes(normalizeName(rawEnName));
}
// ・normalizeName 関数
function normalizeName(str) {
  if (!str) return "";
  return str.toString().trim().replace(/[\s-_]/g, '').toLowerCase();
}

function buildEnToJpMap() {
  EN_TO_JP_RIKISHI = {};
  for (const [jpName, info] of Object.entries(globalRikishiMaster)) {
    if (info.en) EN_TO_JP_RIKISHI[normalizeName(info.en)] = jpName;
    if (Array.isArray(info.en_alt)) {
      info.en_alt.forEach(alt => {
        EN_TO_JP_RIKISHI[normalizeName(alt)] = jpName;
      });
    }
  }
}

// ・getRikishiData 関数
function getRikishiData(nameOrEn) {
  if (!nameOrEn) return { name: "不明", home: "-", heya: "-" };

  // 1. そのまま漢字名で存在する場合
  if (globalRikishiMaster[nameOrEn]) {
    return {
      name: nameOrEn,
      home: globalRikishiMaster[nameOrEn].home || "-",
      heya: globalRikishiMaster[nameOrEn].heya || "-"
    };
  }

  // 2. 英語名を日本語名に変換して検索
  const cleanEn = normalizeName(nameOrEn);
  const jpName = EN_TO_JP_RIKISHI[cleanEn];

  if (jpName && globalRikishiMaster[jpName]) {
    return {
      name: jpName,
      home: globalRikishiMaster[jpName].home || "-",
      heya: globalRikishiMaster[jpName].heya || "-"
    };
  }

  // 3. 部分一致・正規化検索
  for (const [jpKey, info] of Object.entries(globalRikishiMaster)) {
    if (normalizeName(jpKey) === cleanEn || jpKey.includes(nameOrEn) || nameOrEn.includes(jpKey)) {
      return {
        name: jpKey,
        home: info.home || "-",
        heya: info.heya || "-"
      };
    }
  }

  return {
    name: jpName || nameOrEn,
    home: "-",
    heya: "-"
  };
}
// ・formatRankJp 関数（と、その中で使っている toKanjiNum 関数）

function formatRankJp(rawRank) {
  if (!rawRank) return "";

  const rank = rawRank.toString().trim();

  // 1. 三役（横綱・大関・関脇・小結）は、数字がどう付いていても
  //    絶対に「一枚目」等を付けず、役職名のみを即座に返す
  if (/Yokozuna|横綱/i.test(rank)) return "横綱";
  if (/Ozeki|大関/i.test(rank)) return "大関";
  if (/Sekiwake|関脇/i.test(rank)) return "関脇";
  if (/Komusubi|小結/i.test(rank)) return "小結";

  // 2. 階級名の判定（正式名 or 日本語 or 略記 "M1" "Ms12" など）
  let title = "";
  if (/Maegashira|前頭/i.test(rank)) title = "前頭";
  else if (/Juryo|十両/i.test(rank)) title = "十両";
  else if (/Makushita|幕下/i.test(rank)) title = "幕下";
  else if (/Sandanme|三段目/i.test(rank)) title = "三段目";
  else if (/Jonidan|序二段/i.test(rank)) title = "序二段";
  else if (/Jonokuchi|序ノ口/i.test(rank)) title = "序ノ口";
  else {
    // "M1" "Ms12" "J3" のような略記に対応（Ms/Sd/Jd/Jkは2文字なので先にチェック）
    const abbr = rank.match(/^(Ms|Sd|Jd|Jk|M|J)\s*\d+/i);
    if (abbr) {
      const map = { ms: "幕下", sd: "三段目", jd: "序二段", jk: "序ノ口", m: "前頭", j: "十両" };
      title = map[abbr[1].toLowerCase()] || "";
    }
  }

  if (!title) return rank; // どの階級とも判定できなければ元の文字列のまま返す

  // 3. 数字（枚数）の抽出。半角数字がなければ「筆頭」の文字を探す
  let num = null;
  const numMatch = rank.match(/\d+/);
  if (numMatch) {
    num = parseInt(numMatch[0], 10);
  } else if (/筆頭/.test(rank)) {
    num = 1;
  }

  // 4. 表記の組み立て
  if (num === 1) {
    // 前頭・十両の1枚目だけ「筆頭」、幕下以下は「一枚目」
    return (title === "前頭" || title === "十両") ? `${title}筆頭` : `${title}一枚目`;
  }
  if (num !== null && num > 1) {
    return `${title}${toKanjiNum(num)}枚目`;
  }
  return title;
}
// 数字を漢数字に変換するヘルパー関数
function toKanjiNum(numStr) {
  if (!numStr) return "";
  const num = parseInt(numStr, 10);
  if (isNaN(num)) return numStr;

  const kanji = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  if (num <= 10) return kanji[num];
  if (num < 20) return "十" + (kanji[num % 10] || "");
  const tens = Math.floor(num / 10);
  const units = num % 10;
  return (tens === 1 ? "" : kanji[tens]) + "十" + kanji[units];
}
const RANK_TITLE_ORDER = { yokozuna: 0, ozeki: 1, sekiwake: 2, komusubi: 3, maegashira: 4, juryo: 0 };

function rankSortKey(rawRank) {
  if (!rawRank) return [999, 999];
  const rank = rawRank.toString();
  let title = 'maegashira';
  if (/Yokozuna/i.test(rank)) title = 'yokozuna';
  else if (/Ozeki/i.test(rank)) title = 'ozeki';
  else if (/Sekiwake/i.test(rank)) title = 'sekiwake';
  else if (/Komusubi/i.test(rank)) title = 'komusubi';
  else if (/Juryo/i.test(rank)) title = 'juryo';

  const numMatch = rank.match(/\d+/);
  const num = numMatch ? parseInt(numMatch[0], 10) : 1;
  return [RANK_TITLE_ORDER[title] ?? 99, num];
}
function getRankTierClass(rawRank) {
  if (!rawRank) return '';
  const r = rawRank.toString();
  if (/Yokozuna/i.test(r)) return 'tier-yokozuna';
  if (/Ozeki/i.test(r)) return 'tier-ozeki';
  if (/Sekiwake/i.test(r)) return 'tier-sekiwake';
  if (/Komusubi/i.test(r)) return 'tier-komusubi';
  return '';
}
function compareRankKey(a, b) {
  if (a[0] !== b[0]) return a[0] - b[0];
  return a[1] - b[1];
}

let globalRikishiMaster = {};
let banzukeCache = {};

async function fetchBanzuke(bashoCode, division) {
  const cacheKey = `${bashoCode}_${division}`;
  if (banzukeCache[cacheKey]) return banzukeCache[cacheKey];

  const apiUrl = `https://sumo-api.com/api/basho/${bashoCode}/banzuke/${division}`;
  try {
    const response = await fetch(apiUrl);
    if (!response.ok) return { east: [], west: [] };
    const data = await response.json();
    console.log("banzuke data:", data); // ← 確認用（あとで消してOK）
    const east = data.east || [];
    const west = data.west || [];
    banzukeCache[cacheKey] = { east, west };
    return { east, west };
  } catch (e) {
    console.warn("番付データの取得に失敗しました:", e);
    return { east: [], west: [] };
  }
}
let torikumiRecordCache = {};
let rikishiRecords = {};
let recordsBuiltBasho = null;

async function fetchDayResultsForRecord(division, day) {
  const cacheKey = `${CURRENT_BASHO}_${division}_${day}`;
  if (torikumiRecordCache[cacheKey]) return torikumiRecordCache[cacheKey];

  const apiUrl = `https://sumo-api.com/api/basho/${CURRENT_BASHO}/torikumi/${division}/${day}`;
  try {
    const response = await fetch(apiUrl);
    if (!response.ok) { torikumiRecordCache[cacheKey] = []; return []; }
    const data = await response.json();
    if (!data || !Array.isArray(data.torikumi)) { torikumiRecordCache[cacheKey] = []; return []; }

    const list = data.torikumi.map(item => {
      const isEastWinner = item.winnerId && item.winnerId === item.eastId;
      const isWestWinner = item.winnerId && item.winnerId === item.westId;
      const eastInfo = getRikishiData(item.eastShikona);
      const westInfo = getRikishiData(item.westShikona);
      return {
        east: eastInfo.name,
        west: westInfo.name,
        eastResult: isEastWinner ? '〇' : (isWestWinner ? '●' : ''),
        westResult: isWestWinner ? '〇' : (isEastWinner ? '●' : '')
      };
    });
    torikumiRecordCache[cacheKey] = list;
    return list;
  } catch (e) {
    console.warn(`${division} ${day}日目の集計用データ取得失敗:`, e);
    torikumiRecordCache[cacheKey] = [];
    return [];
  }
}

async function buildRikishiRecordsIfNeeded(bashoCode) {
  if (recordsBuiltBasho === bashoCode) return;

  rikishiRecords = {};
  const divisions = ["Makuuchi", "Juryo", "Makushita"];
  const fetchPromises = [];
  for (let d = 1; d <= 15; d++) {
    divisions.forEach(div => fetchPromises.push(fetchDayResultsForRecord(div, d)));
  }
  await Promise.all(fetchPromises);

  for (let d = 1; d <= 15; d++) {
    divisions.forEach(div => {
      const cacheKey = `${bashoCode}_${div}_${d}`;
      const dayMatches = torikumiRecordCache[cacheKey] || [];
      dayMatches.forEach(m => {
        if (m.east) {
          if (!rikishiRecords[m.east]) rikishiRecords[m.east] = { wins: 0, losses: 0 };
          if (m.eastResult === '〇') rikishiRecords[m.east].wins++;
          if (m.eastResult === '●') rikishiRecords[m.east].losses++;
        }
        if (m.west) {
          if (!rikishiRecords[m.west]) rikishiRecords[m.west] = { wins: 0, losses: 0 };
          if (m.westResult === '〇') rikishiRecords[m.west].wins++;
          if (m.westResult === '●') rikishiRecords[m.west].losses++;
        }
      });
    });
  }
  recordsBuiltBasho = bashoCode;
}

function getRecordHtml(name, kyujo) {
  const rec = rikishiRecords[name] || { wins: 0, losses: 0 };
  const total = rec.wins + rec.losses;

  if (kyujo) {
    if (total === 0) return '－'; // 初日から全休の力士
    const restDays = Math.max(0, 15 - total);
    return `（${rec.wins}勝${rec.losses}敗${restDays}休）`;
  }

  if (total === 0) return '－';
  return `（${rec.wins}勝${rec.losses}敗）`;
}

function getEntryInfo(entry) {
  if (!entry) return null;
  const rawName = entry.shikonaEn || entry.shikonaJp || '';
  const info = getRikishiData(rawName);
  const rank = entry.rank || entry.rankValue || '';
  const kyujo = isKyujo(rawName);
  const recordHtml = getRecordHtml(info.name, kyujo);
  return { name: info.name, home: info.home, heya: info.heya, rank, kyujo, recordHtml };
}

async function renderBanzuke() {
  document.getElementById('tab-makuuchi')?.classList.toggle('active', currentDivision === 'Makuuchi');
  document.getElementById('tab-juryo')?.classList.toggle('active', currentDivision === 'Juryo');
  document.getElementById('banzuke-title').textContent = `${BASHO_LABELS[CURRENT_BASHO] || CURRENT_BASHO} 番付表`;

  const listContainer = document.getElementById('banzuke-list');
  listContainer.innerHTML = '<div style="color:white; margin:30px;">読み込み中...</div>';
  await buildRikishiRecordsIfNeeded(CURRENT_BASHO); // ← 追加
  const { east, west } = await fetchBanzuke(CURRENT_BASHO, currentDivision);

  if (east.length === 0 && west.length === 0) {
    listContainer.innerHTML = '<div style="color:#cbd5e1; margin:30px;">この場所の番付データはまだありません。</div>';
    return;
  }

    // 東西を「同じ番付同士」で組み合わせる
  const rows = [];
  let i = 0, j = 0;
  while (i < east.length || j < west.length) {
    const eEntry = east[i];
    const wEntry = west[j];

    if (eEntry && wEntry) {
      const cmp = compareRankKey(
        rankSortKey(eEntry.rank || eEntry.rankValue),
        rankSortKey(wEntry.rank || wEntry.rankValue)
      );
      if (cmp === 0) {
        rows.push({ east: eEntry, west: wEntry });
        i++; j++;
      } else if (cmp < 0) {
        rows.push({ east: eEntry, west: null });
        i++;
      } else {
        rows.push({ east: null, west: wEntry });
        j++;
      }
    } else if (eEntry) {
      rows.push({ east: eEntry, west: null });
      i++;
    } else if (wEntry) {
      rows.push({ east: null, west: wEntry });
      j++;
    }
  }

  const table = document.createElement('table');
  table.className = 'banzuke-table';
  table.innerHTML = `<thead><tr><th>東</th><th>番付</th><th>西</th></tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  rows.forEach(row => {
    const e = getEntryInfo(row.east);
    const w = getEntryInfo(row.west);
    const rankLabel = formatRankJp((e && e.rank) || (w && w.rank) || '');
    const tierClass = getRankTierClass((e && e.rank) || (w && w.rank) || ''); // ← 追加

    const tr = document.createElement('tr');
    tr.className = tierClass; // ← 追加
            tr.innerHTML = `
      <td class="name-cell">
        ${e ? `<span class="shikona">${e.name}${e.kyujo ? '<span class="kyujo-mark">休</span>' : ''}</span><span class="sub">${e.home}・${e.heya}</span><span class="cell-record">${e.recordHtml}</span>` : ''}
      </td>
      <td class="rank-cell">${rankLabel}</td>
      <td class="name-cell">
        ${w ? `<span class="shikona">${w.name}${w.kyujo ? '<span class="kyujo-mark">休</span>' : ''}</span><span class="sub">${w.home}・${w.heya}</span><span class="cell-record">${w.recordHtml}</span>` : ''}
      </td>
    `;
    tbody.appendChild(tr);
  });

  listContainer.innerHTML = '';
  listContainer.appendChild(table);
}

function switchBanzukeBasho(bashoCode) {
  CURRENT_BASHO = bashoCode;
  renderBanzuke();
}

function switchBanzukeDivision(division) {
  currentDivision = division;
  renderBanzuke();
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const meiboRes = await fetch('meibo.json');
    globalRikishiMaster = await meiboRes.json();
    buildEnToJpMap(); // ← 追加
  } catch (e) {
    console.warn("meibo.json の読み込み失敗:", e);
  }
  initBashoSelect(); // ← 追加
  await renderBanzuke();
});
</script>
</body>
