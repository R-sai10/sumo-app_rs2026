let bashoAwardsCache = {}; // 場所ごとの優勝・三賞情報のキャッシュ

let globalRikishiMaster = {};
let torikumiCache = {}; 

function normalizeName(str) {
  if (!str) return "";
  return str.toString().trim().replace(/[\s-_]/g, '').toLowerCase();
}

function getKimariteJp(englishKimarite) {
  if (!englishKimarite) return "-";
  const lower = englishKimarite.toLowerCase().trim();
  return KIMARITE_MAP[lower] || englishKimarite;
}

// 力士マスター情報（名前・出身地・部屋）を取得する関数
function getRikishiData(nameOrEn) {
  if (!nameOrEn) return { name: "不明", home: "-", heya: "-" };

  // 1. そのまま漢字名で存在する場合
  if (globalRikishiMaster[nameOrEn]) {
    return {
      name: nameOrEn,
      home: globalRikishiMaster[nameOrEn].home || "-",
      heya: globalRikishiMaster[nameOrEn].heya || "-"
    };
  }

  // 2. 英語名を日本語名に変換して検索
  const cleanEn = normalizeName(nameOrEn);
  const jpName = EN_TO_JP_RIKISHI[cleanEn];

  if (jpName && globalRikishiMaster[jpName]) {
    return {
      name: jpName,
      home: globalRikishiMaster[jpName].home || "-",
      heya: globalRikishiMaster[jpName].heya || "-"
    };
  }

  // 3. 部分一致・正規化検索
  for (const [jpKey, info] of Object.entries(globalRikishiMaster)) {
    if (normalizeName(jpKey) === cleanEn || jpKey.includes(nameOrEn) || nameOrEn.includes(jpKey)) {
      return {
        name: jpKey,
        home: info.home || "-",
        heya: info.heya || "-"
      };
    }
  }

  return {
    name: jpName || nameOrEn,
    home: "-",
    heya: "-"
  };
}

// 数字を漢数字に変換するヘルパー関数
function toKanjiNum(numStr) {
  if (!numStr) return "";
  const num = parseInt(numStr, 10);
  if (isNaN(num)) return numStr;

  const kanji = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  if (num <= 10) return kanji[num];
  if (num < 20) return "十" + (kanji[num % 10] || "");
  const tens = Math.floor(num / 10);
  const units = num % 10;
  return (tens === 1 ? "" : kanji[tens]) + "十" + kanji[units];
}

function formatRankJp(rawRank) {
  if (!rawRank) return "";

  const rank = rawRank.toString().trim();

  // 1. 三役（横綱・大関・関脇・小結）は、数字がどう付いていても
  //    絶対に「一枚目」等を付けず、役職名のみを即座に返す
  if (/Yokozuna|横綱/i.test(rank)) return "横綱";
  if (/Ozeki|大関/i.test(rank)) return "大関";
  if (/Sekiwake|関脇/i.test(rank)) return "関脇";
  if (/Komusubi|小結/i.test(rank)) return "小結";

  // 2. 階級名の判定（正式名 or 日本語 or 略記 "M1" "Ms12" など）
  let title = "";
  if (/Maegashira|前頭/i.test(rank)) title = "前頭";
  else if (/Juryo|十両/i.test(rank)) title = "十両";
  else if (/Makushita|幕下/i.test(rank)) title = "幕下";
  else if (/Sandanme|三段目/i.test(rank)) title = "三段目";
  else if (/Jonidan|序二段/i.test(rank)) title = "序二段";
  else if (/Jonokuchi|序ノ口/i.test(rank)) title = "序ノ口";
  else {
    // "M1" "Ms12" "J3" のような略記に対応（Ms/Sd/Jd/Jkは2文字なので先にチェック）
    const abbr = rank.match(/^(Ms|Sd|Jd|Jk|M|J)\s*\d+/i);
    if (abbr) {
      const map = { ms: "幕下", sd: "三段目", jd: "序二段", jk: "序ノ口", m: "前頭", j: "十両" };
      title = map[abbr[1].toLowerCase()] || "";
    }
  }

  if (!title) return rank; // どの階級とも判定できなければ元の文字列のまま返す

  // 3. 数字（枚数）の抽出。半角数字がなければ「筆頭」の文字を探す
  let num = null;
  const numMatch = rank.match(/\d+/);
  if (numMatch) {
    num = parseInt(numMatch[0], 10);
  } else if (/筆頭/.test(rank)) {
    num = 1;
  }

  // 4. 表記の組み立て
  if (num === 1) {
    // 前頭・十両の1枚目だけ「筆頭」、幕下以下は「一枚目」
    return (title === "前頭" || title === "十両") ? `${title}筆頭` : `${title}一枚目`;
  }
  if (num !== null && num > 1) {
    return `${title}${toKanjiNum(num)}枚目`;
  }
  return title;
}

// APIレスポンス変換関数（修正版）
function convertSumoApiToTorikumiFormat(apiTorikumiList) {
  return apiTorikumiList.map(item => {
    // winnerId と eastId/westId を使って勝敗を確実に判定
    const isEastWinner = item.winnerId && item.winnerId === item.eastId;
    const isWestWinner = item.winnerId && item.winnerId === item.westId;

    // sumo-apiのレスポンスフィールドから番付を取得
    const rawEastRank = item.eastRank || item.eastRankJp || item.eastBanzuke || item.eastRankName || "";
    const rawWestRank = item.westRank || item.westRankJp || item.westBanzuke || item.westRankName || "";

    return {
      eastRaw: item.eastShikona,
      westRaw: item.westShikona,
      eastId: item.eastId,   // ← 追加
      westId: item.westId,   // ← 追加
      // 画面表示用の四股名（英語の四股名をそのままセットしておく）
      east: item.eastShikona || "東力士",
      west: item.westShikona || "西力士",
      eastRank: formatRankJp(rawEastRank), 
      westRank: formatRankJp(rawWestRank), 
      kimarite: getKimariteJp(item.kimarite),
      winner: item.winnerEn || "",
      eastResult: isEastWinner ? '〇' : (isWestWinner ? '●' : ''),
      westResult: isWestWinner ? '〇' : (isEastWinner ? '●' : '')
    };
  });
}

async function fetchDayTorikumi(division, day) {
  const cacheKey = `${CURRENT_BASHO}_${division}_${day}`;
  if (torikumiCache[cacheKey] && torikumiCache[cacheKey].length > 0) {
    return torikumiCache[cacheKey];
  }
  
  const apiUrl = `https://sumo-api.com/api/basho/${CURRENT_BASHO}/torikumi/${division}/${day}`;
  try {
    const response = await fetch(apiUrl);
    
    if (!response.ok) {
      if (response.status === 404) {
        return [];
      }
      throw new Error(`HTTPエラー: ${response.status}`);
    }

    const data = await response.json();
    
    if (!data || !Array.isArray(data.torikumi)) {
      return [];
    }

    const formatted = convertSumoApiToTorikumiFormat(data.torikumi);
    
    // meibo.json から検索し、失敗しても落ちないように安全対策（try-catch）を追加
    formatted.forEach(m => {
      try {
        if (typeof getRikishiData === 'function') {
          const eastData = getRikishiData(m.eastRaw);
          if (eastData && eastData.name) m.east = eastData.name;

          const westData = getRikishiData(m.westRaw);
          if (westData && westData.name) m.west = westData.name;
        }
      } catch (e) {
        console.warn("名簿データの参照に失敗したため、APIの表記を使用します:", e);
      }
    });

    torikumiCache[cacheKey] = formatted;
    return formatted;
  } catch (error) {
    console.error(`${division} ${day}日目の取得失敗:`, error);
    return { error: true, message: error.message };
  }
}

function extractAwards(data) {
  const yushoIdSet = new Set();
  const yushoNameSet = new Set();
  const sanshoIdMap = new Map();
  const sanshoNameMap = new Map();

  (data.yusho || []).forEach(y => {
    if (y.rikishiId) yushoIdSet.add(y.rikishiId);
    if (y.shikonaEn) yushoNameSet.add(normalizeName(y.shikonaEn));
  });

  (data.specialPrizes || []).forEach(s => {
    const rawType = (s.type || "").toLowerCase();
    const prizeJp = SANSHO_MAP[rawType] || s.type || "三賞";

    if (s.rikishiId) {
      if (!sanshoIdMap.has(s.rikishiId)) sanshoIdMap.set(s.rikishiId, []);
      sanshoIdMap.get(s.rikishiId).push(prizeJp);
    }
    if (s.shikonaEn) {
      const key = normalizeName(s.shikonaEn);
      if (!sanshoNameMap.has(key)) sanshoNameMap.set(key, []);
      sanshoNameMap.get(key).push(prizeJp);
    }
  });

  return { yushoIdSet, yushoNameSet, sanshoIdMap, sanshoNameMap };
}

async function fetchBashoAwards(bashoCode) {
  if (bashoAwardsCache[bashoCode]) return bashoAwardsCache[bashoCode];

  const emptyAwards = {
    yushoIdSet: new Set(),
    yushoNameSet: new Set(),
    sanshoIdMap: new Map(),
    sanshoNameMap: new Map()
  };
  const apiUrl = `https://sumo-api.com/api/basho/${bashoCode}`;

  try {
    const response = await fetch(apiUrl);
    if (!response.ok) {
      bashoAwardsCache[bashoCode] = emptyAwards;
      return emptyAwards;
    }
    const data = await response.json();
    const awards = extractAwards(data);
    bashoAwardsCache[bashoCode] = awards;
    return awards;
  } catch (e) {
    console.warn(`${bashoCode} の優勝・三賞情報の取得に失敗しました:`, e);
    bashoAwardsCache[bashoCode] = emptyAwards;
    return emptyAwards;
  }
}


function buildAwardMarksHtml(rikishiId, rawEnName, day) {
  if (parseInt(day, 10) !== 15) return '';  
  const awards = bashoAwardsCache[CURRENT_BASHO];
  if (!awards) return '';

  let html = '';
  const nameKey = normalizeName(rawEnName || '');

  const isYusho = (rikishiId && awards.yushoIdSet.has(rikishiId))
                || (nameKey && awards.yushoNameSet.has(nameKey));
  if (isYusho) {
    html += `<span class="yusho-mark">🏆 優勝</span>`;
  }

  const sanshoList = (rikishiId && awards.sanshoIdMap.get(rikishiId))
                   || (nameKey && awards.sanshoNameMap.get(nameKey))
                   || [];
  sanshoList.forEach(prize => {
    const cssClass = SANSHO_CLASS_MAP[prize] || "sansho-kanto";
    html += `<span class="sansho-mark ${cssClass}">${prize}</span>`;
});

  return html;
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const meiboRes = await fetch('meibo.json');
    globalRikishiMaster = await meiboRes.json();
  } catch (e) {
    console.warn("meibo.json の読み込み失敗:", e);
  }

  await switchBasho(CURRENT_BASHO);

  const daySelect = document.getElementById('day-select');
  if (daySelect) {
    daySelect.addEventListener('change', async (event) => {
      await renderTorikumi(event.target.value);
    });
  }
});

async function switchBasho(bashoCode) {
  if (!BASHO_CONFIG[bashoCode]) return;
  
  CURRENT_BASHO = bashoCode;
  await fetchBashoAwards(bashoCode); // ← 追加
  
  document.getElementById('btn-basho-202607')?.classList.toggle('active', bashoCode === '202607');
  document.getElementById('btn-basho-202609')?.classList.toggle('active', bashoCode === '202609');

  const config = BASHO_CONFIG[bashoCode];
  if (document.getElementById('basho-title')) {
    document.getElementById('basho-title').textContent = config.title;
  }
  if (document.getElementById('basho-sub-info')) {
    document.getElementById('basho-sub-info').textContent = config.subInfo;
  }

  const daySelect = document.getElementById('day-select');
  if (daySelect) {
    daySelect.innerHTML = '';
    config.days.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.value;
      opt.textContent = d.label;
      daySelect.appendChild(opt);
    });
    daySelect.value = bashoCode === "202607" ? 15 : 1;
  }

  await renderTorikumi(daySelect ? daySelect.value : 1);
}

async function switchDivision(division) {
  currentDivision = division;
  
  document.getElementById('tab-makuuchi')?.classList.toggle('active', division === 'Makuuchi');
  document.getElementById('tab-juryo')?.classList.toggle('active', division === 'Juryo');
  if (document.getElementById('division-title')) {
    document.getElementById('division-title').textContent = division === 'Makuuchi' ? '〈 幕内 〉' : '〈 十両 〉';
  }

  const daySelect = document.getElementById('day-select');
  const currentDay = daySelect ? daySelect.value : 1;
  await renderTorikumi(currentDay);
}

async function renderTorikumi(day) {
  const listContainer = document.getElementById('torikumi-list');
  if (!listContainer) return;

  listContainer.innerHTML = '<div style="color:white; font-size:18px; margin: 30px;">データを読み込み中...</div>';
  
  try {
    const fetchPromises = [];
    for (let d = 1; d <= parseInt(day); d++) {
      fetchPromises.push(fetchDayTorikumi("Makuuchi", d));
      fetchPromises.push(fetchDayTorikumi("Juryo", d));
    }
    await Promise.all(fetchPromises);

    const matches = await fetchDayTorikumi(currentDivision, day);
    listContainer.innerHTML = '';

    if (matches && matches.error) {
      listContainer.innerHTML = `
        <div style="background-color: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 20px; border-radius: 8px; max-width: 600px; margin: 30px auto;">
          <h3 style="margin-top:0;">通信エラーが発生しました</h3>
          <p>取組データの取得に失敗しました。キャッシュリセットをお試しください。</p>
        </div>`;
      return;
    }

    if (!matches || matches.length === 0) {
      listContainer.innerHTML = `
        <div style="color:#cbd5e1; font-size:18px; margin: 40px auto; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 8px; max-width: 500px;">
          📅 ${day}日目の取組データはまだ登録されていないか、休止日です。
        </div>`;
      return;
    }

    const table = document.createElement('table');
    table.className = 'torikumi-table';

    table.innerHTML = `
      <thead>
        <tr>
          <th colspan="2">東</th>
          <th>決まり手</th>
          <th colspan="2">西</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector('tbody');

    matches.forEach((match, index) => {
      const eastInfo = getRikishiData(match.eastRaw || match.east);
      const westInfo = getRikishiData(match.westRaw || match.west);

      const displayEastBanzuke = match.eastRank;
　　　const displayWestBanzuke = match.westRank;

      match.east = eastInfo.name;
      match.west = westInfo.name;

      const isEastWin = match.eastResult === '〇';
      const isWestWin = match.westResult === '〇';

      const eastMarkChar = isEastWin ? '〇' : (match.eastResult === '●' ? '●' : '');
      const westMarkChar = isWestWin ? '〇' : (match.westResult === '●' ? '●' : '');

            const tr = document.createElement('tr');
            
      tr.innerHTML = `
        <!-- 東 力士情報 -->
        <td class="cell-rikishi ${isEastWin ? 'winner-bg' : ''}">
          <span class="cell-rank">${displayEastBanzuke}</span>
          <span class="cell-name" id="name-east-${index}">${eastInfo.name}</span>
          <div class="cell-award-marks">${buildAwardMarksHtml(match.eastId, match.eastRaw, day)}</div>
          <div class="cell-record">
            （<span id="record-east-${index}">0勝0敗</span><span id="status-east-${index}"></span>）
          </div>
          <span class="cell-sub-info">${eastInfo.home}・${eastInfo.heya}</span>
        </td>

        <!-- 東 勝敗マーク -->
        <td class="cell-mark ${isEastWin ? 'win-mark' : 'lose-mark'}">
          ${eastMarkChar}
        </td>

        <!-- 決まり手 -->
        <td class="cell-kimarite">
          ${match.kimarite || '-'}
        </td>

        <!-- 西 勝敗マーク -->
        <td class="cell-mark ${isWestWin ? 'win-mark' : 'lose-mark'}">
          ${westMarkChar}
        </td>

        <!-- 西 力士情報 -->
        <td class="cell-rikishi ${isWestWin ? 'winner-bg' : ''}">
          <span class="cell-rank">${displayWestBanzuke}</span>
          <span class="cell-name" id="name-west-${index}">${westInfo.name}</span>
          <div class="cell-award-marks">${buildAwardMarksHtml(match.westId, match.westRaw, day)}</div>
          <div class="cell-record">
            （<span id="record-west-${index}">0勝0敗</span><span id="status-west-${index}"></span>）
          </div>
          <span class="cell-sub-info">${westInfo.home}・${westInfo.heya}</span>
        </td>
      `;
      tbody.appendChild(tr);
    });

    listContainer.appendChild(table);
    calculateTotalRecords(parseInt(day));

  } catch (err) {
    console.error("描画例外エラー:", err);
    listContainer.innerHTML = '<div style="color:#ef4444; font-size:18px; margin: 30px;">予期せぬエラーが発生しました。</div>';
  }
}

function updateKachiMakeStatus(side, index, wins, losses) {
  const statusSpan = document.getElementById(`status-${side}-${index}`);
  if (!statusSpan) return;

  if (wins >= 8) {
    statusSpan.innerHTML = `<span class="kachikoshi-mark"> 勝ち越し</span>`;
  } else if (losses >= 8) {
    statusSpan.innerHTML = `<span class="makekoshi-mark"> 負け越し</span>`;
  } else {
    statusSpan.innerHTML = '';
  }
}

function calculateTotalRecords(targetDay) {
  const rikishiStats = {};

  for (let d = 1; d <= targetDay; d++) {
    const divisions = ["Makuuchi", "Juryo"];
    
    divisions.forEach(div => {
      const cacheKey = `${CURRENT_BASHO}_${div}_${d}`;
      const dayMatches = torikumiCache[cacheKey] || [];

      dayMatches.forEach(match => {
        if (match.east) {
          if (!rikishiStats[match.east]) rikishiStats[match.east] = { wins: 0, losses: 0 };
          if (match.eastResult === '〇') rikishiStats[match.east].wins++;
          if (match.eastResult === '●') rikishiStats[match.east].losses++;
        }
        if (match.west) {
          if (!rikishiStats[match.west]) rikishiStats[match.west] = { wins: 0, losses: 0 };
          if (match.westResult === '〇') rikishiStats[match.west].wins++;
          if (match.westResult === '●') rikishiStats[match.west].losses++;
        }
      });
    });
  }

  const rows = document.querySelectorAll('.torikumi-table tbody tr');
  rows.forEach((row, index) => {
    const eastName = document.getElementById(`name-east-${index}`)?.textContent;
    const westName = document.getElementById(`name-west-${index}`)?.textContent;

    const eastStat = rikishiStats[eastName] || { wins: 0, losses: 0 };
    const westStat = rikishiStats[westName] || { wins: 0, losses: 0 };

    const eastSpan = document.getElementById(`record-east-${index}`);
    const westSpan = document.getElementById(`record-west-${index}`);

    if (eastSpan) {
      eastSpan.textContent = `${eastStat.wins}勝${eastStat.losses}敗`;
      updateKachiMakeStatus('east', index, eastStat.wins, eastStat.losses);
    }
    if (westSpan) {
      westSpan.textContent = `${westStat.wins}勝${westStat.losses}敗`;
      updateKachiMakeStatus('west', index, westStat.wins, westStat.losses);
    }
  });
}

document.getElementById('clear-btn')?.addEventListener('click', async () => {
  torikumiCache = {};
  const daySelect = document.getElementById('day-select');
  const currentDay = daySelect ? daySelect.value : 1;
  await renderTorikumi(currentDay);
  alert('APIキャッシュをリセットし、再読み込みしました。');
});
